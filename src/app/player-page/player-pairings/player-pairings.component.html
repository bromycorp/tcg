<mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start">
    @for (file of fileUploads; track file; let index = $index) {
        <mat-tab [label]="file.url.key">
            <img [src]="file.url.url" referrerpolicy="no-referrer" />
    
          
        </mat-tab>
      }
</mat-tab-group>
